<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Страйкбол: Интерактивная Сетка</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e2522;
            color: #e2e8f0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #b3c0a4;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid #556b2f;
            padding-bottom: 10px;
            font-size: 24px;
            text-align: center;
            width: 100%;
            max-width: 900px;
        }
        .info-text {
            font-size: 13px;
            color: #a3a3a3;
            margin-bottom: 20px;
            text-align: center;
        }
        .bracket-container {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 40px;
            width: 100%;
            max-width: 1000px;
            margin-top: 10px;
        }
        .round-box {
            display: flex;
            flex-direction: column;
            width: 100%;
            flex: 1;
        }
        .round-title {
            text-align: center;
            font-size: 12px;
            text-transform: uppercase;
            color: #b3c0a4;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 15px;
            background: #1a221e;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #3f4e46;
        }
        .round {
            display: flex;
            flex-direction: column;
            gap: 50px;
        }
        .matchup-card {
            background: #2d3732;
            border: 1px solid #3f4e46;
            border-radius: 6px;
            padding: 12px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .team-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        select, input[type="number"], button {
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #4a5d52;
            background: #1a221e;
            color: #f1f2f6;
            box-sizing: border-box;
        }
        select {
            flex: 1;
            font-weight: bold;
        }
        input[type="number"] {
            width: 55px;
            text-align: center;
            font-weight: bold;
            font-size: 15px;
            border-color: #d97706;
        }
        button {
            background: #d97706;
            color: #1e2522;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 11px;
            width: 100%;
            border: none;
            padding: 10px;
        }
        button:hover {
            background: #f59e0b;
        }
        .admin-controls {
            display: none; /* Скрыто по умолчанию для зрителей */
            margin-top: 5px;
        }
        body.is-admin .admin-controls {
            display: block;
        }
        .viewer-text {
            font-weight: bold;
            font-size: 14px;
            color: #e2e8f0;
        }
        body.is-admin .viewer-text {
            display: none; /* Админ видит селекторы, зритель видит просто текст */
        }
        @media screen and (max-width: 768px) {
            .bracket-container {
                flex-direction: column;
                gap: 30px;
            }
            .round {
                gap: 20px;
            }
        }
    </style>
</head>
<body>

    <h1>Плей-офф: Тактическое Табло</h1>
    <p class="info-text">В режиме администратора вы можете выбирать любые команды из базы и записывать исходы матчей.</p>
    
    <div style="width:100%; max-width:1000px; text-align:left; margin-bottom:10px;">
        <button onclick="loadBracketData()" style="width:auto; background:#4a5d52; color:white; padding:8px 15px;">🔄 Синхронизировать с базой</button>
    </div>

    <div class="bracket-container">
        <!-- ПОЛУФИНАЛЫ -->
        <div class="round-box">
            <div class="round-title">Полуфиналы</div>
            <div class="round">
                
                <!-- МАТЧ 1 -->
                <div class="matchup-card">
                    <div class="team-row">
                        <span class="viewer-text" id="view-s1-t1">Ожидание...</span>
                        <select id="select-s1-t1" class="admin-controls"></select>
                        <input type="number" id="score-s1-t1" placeholder="0" min="0">
                    </div>
                    <div class="team-row">
                        <span class="viewer-text" id="view-s1-t2">Ожидание...</span>
                        <select id="select-s1-t2" class="admin-controls"></select>
                        <input type="number" id="score-s1-t2" placeholder="0" min="0">
                    </div>
                    <div class="admin-controls">
                        <button onclick="recordBracketMatch('s1')">Записать Полуфинал 1</button>
                    </div>
                </div>

                <!-- МАТЧ 2 -->
                <div class="matchup-card">
                    <div class="team-row">
                        <span class="viewer-text" id="view-s2-t1">Ожидание...</span>
                        <select id="select-s2-t1" class="admin-controls"></select>
                        <input type="number" id="score-s2-t1" placeholder="0" min="0">
                    </div>
                    <div class="team-row">
                        <span class="viewer-text" id="view-s2-t2">Ожидание...</span>
                        <select id="select-s2-t2" class="admin-controls"></select>
                        <input type="number" id="score-s2-t2" placeholder="0" min="0">
                    </div>
                    <div class="admin-controls">
                        <button onclick="recordBracketMatch('s2')">Записать Полуфинал 2</button>
                    </div>
                </div>

            </div>
        </div>

        <!-- ФИНАЛ -->
        <div class="round-box">
            <div class="round-title">Гранд-Финал</div>
            <div class="round">
                
                <div class="matchup-card" style="border-color: #d97706;">
                    <div class="team-row">
                        <span class="viewer-text" id="view-f-t1">Ожидание...</span>
                        <select id="select-f-t1" class="admin-controls"></select>
                        <input type="number" id="score-f-t1" placeholder="0" min="0">
                    </div>
                    <div class="team-row">
                        <span class="viewer-text" id="view-f-t2">Ожидание...</span>
                        <select id="select-f-t2" class="admin-controls"></select>
                        <input type="number" id="score-f-t2" placeholder="0" min="0">
                    </div>
                    <div class="admin-controls">
                        <button onclick="recordBracketMatch('f')" style="background:#f59e0b;">Записать Финал</button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="supabase-connect.js"></script>
    <script>
        const SUPABASE_URL = 'https://supabase.co';
        const SUPABASE_KEY = 'sb_publishable_7icoBzwIZQ8p-IdnituWMg_2xbKz5ly';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        /* Синхронизируем статус админа с главной страницы */
        let isAdmin = JSON.parse(localStorage.getItem('str_is_admin')) || false;
        if (isAdmin) {
            document.body.classList.add('is-admin');
        }

        let cloudTeamsList = [];

        async function loadBracketData() {
            try {
                const { data: cloudTeams, error } = await supabaseClient.from('teams').select('*');
                if (error) throw error;
                cloudTeamsList = cloudTeams || [];

                /* Сортируем команды для автоподстановки (топ-4) */
                const sorted = [...cloudTeamsList].sort((a, b) => b.points - a.points);

                /* Названия полей для связки циклом */
                const fields = ['s1-t1', 's1-t2', 's2-t1', 's2-t2', 'f-t1', 'f-t2'];

                fields.forEach((field, idx) => {
                    const selectEl = document.getElementById('select-' + field);
                    if (selectEl) {
                        /* Генерируем опции выбора из всех добавленных команд */
                        selectEl.innerHTML = cloudTeamsList.map(t => `<option value="${t.name}">${t.name}</option>`).join('');
                        
                        /* Автоподстановка топ-4 для полуфиналов */
                        if (sorted[idx] && idx < 4) {
                            selectEl.value = sorted[idx].name;
                            document.getElementById('view-' + field.split('-')[0] + '-t' + field.split('-')[1].replace('t','')).innerText = sorted[idx].name;
                        }
                    }
                });

                /* Для финала по умолчанию подставим заглушки */
                if (!document.getElementById('view-f-t1').innerText || document.getElementById('view-f-t1').innerText === 'Ожидание...') {
                    document.getElementById('view-f-t1').innerText = 'Победитель П1';
                    document.getElementById('view-f-t2').innerText = 'Победитель П2';
                }

            } catch (err) {
console.error('Ошибка связи с облаком:', err.message);}}/* ЗАПИСЬ ИГРЫ ИЗ СЕТКИ ПЛЕЙ-ОФФ */async function recordBracketMatch(matchId) {if (!isAdmin) return;const t1 = document.getElementById('select-' + matchId + '-t1').value;const t2 = document.getElementById('select-' + matchId + '-t2').value;const s1 = parseInt(document.getElementById('score-' + matchId + '-t1').value);const s2 = parseInt(document.getElementById('score-' + matchId + '-t2').value);if (!t1 || !t2 || t1 === t2 || isNaN(s1) || isNaN(s2) || s1 < 0 || s2 < 0) {alert("Проверьте правильность заполнения команд и счета!");return;}/* Находим текущую статистику команд в локальном списке */let team1Data = cloudTeamsList.find(t => t.name === t1);let team2Data = cloudTeamsList.find(t => t.name === t2);let t1_pts = team1Data.points, t1_w = team1Data.wins, t1_d = team1Data.draws, t1_l = team1Data.losses;let t2_pts = team2Data.points, t2_w = team2Data.wins, t2_d = team2Data.draws, t2_l = team2Data.losses;/* Начисляем очки по правилам турнира */if (s1 > s2) {t1_pts += 2; t1_w += 1; t2_l += 1;if (matchId === 's1') document.getElementById('select-f-t1').value = t1;if (matchId === 's2') document.getElementById('select-f-t2').value = t1;} else if (s2 > s1) {t2_pts += 2; t2_w += 1; t1_l += 1;if (matchId === 's1') document.getElementById('select-f-t1').value = t2;if (matchId === 's2') document.getElementById('select-f-t2').value = t2;} else {t1_pts += 1; t2_pts += 1; t1_d += 1; t2_d += 1;}let d = new Date();let timeString = String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + d.getFullYear() + ' в ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');/* Записываем матч в историю и обновляем очки в базе Supabase */await supabaseClient.from('matches').insert([{ t1, s1, t2, s2, time: timeString + ' (Плей-офф)' }]);await supabaseClient.from('teams').update({ points: t1_pts, wins: t1_w, draws: t1_d, losses: t1_l }).eq('name', t1);await supabaseClient.from('teams').update({ points: t2_pts, wins: t2_w, draws: t2_d, losses: t2_l }).eq('name', t2);alert('Игра успешно записана в общую историю турнира!');loadBracketData();}loadBracketData();
